<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings — Ask Plaud</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-frame">

    <header class="header">
      <a href="/" class="header-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12 5l-5 5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1 class="header-title">Settings</h1>
      <span class="header-btn" style="visibility:hidden"></span>
    </header>

    <div class="config-page">
      <div class="config-section">
        <label class="config-label">Model</label>
        <p class="config-hint" id="model-name">Loading...</p>
      </div>

      <div class="config-section">
        <label class="config-label">Authentication</label>
        <p class="config-hint config-hint-ok">Managed by gcloud CLI (Application Default Credentials)</p>
      </div>
    </div>

  </div>

  <script>
    (function() {
      fetch('/api/config')
        .then(r => r.json())
        .then(data => {
          document.getElementById('model-name').textContent = data.model || '—';
        })
        .catch(() => {
          document.getElementById('model-name').textContent = '—';
        });
    })();
  </script>
</body>
</html>
